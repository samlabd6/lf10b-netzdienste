[defaults]
inventory = inventory.ini                  ; default inventory file
remote_user = samuel                       ; SSH user created by cloud-init
host_key_checking = False                  ; VMs are recreated often, do not stop at new host keys
retry_files_enabled = False                ; no *.retry files after failed runs
vault_password_file = /root/.vault-pass    ; vault password file (outside the repository)
interpreter_python = auto_silent           ; use the discovered Python without the warning
log_path = /var/log/ansible.log            ; every run is logged: who changed what and when (change management)

[privilege_escalation]
become = True                              ; run tasks with sudo

