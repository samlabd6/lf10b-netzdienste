groups:
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.job }} on {{ $labels.host }} is down" }

  - name: resources
    rules:
      - alert: MemoryHigh
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "RAM usage on {{ $labels.host }} above 90 %" }

      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Less than 15 % free on {{ $labels.host }} {{ $labels.mountpoint }}" }

  - name: backup
    rules:
      # Restic: last run failed (per server and target)
      - alert: BackupFailed
        expr: restic_backup_success == 0
        labels: { severity: critical }
        annotations: { summary: "Last backup of {{ $labels.host }} to {{ $labels.repo }} failed" }

      # Restic: no successful backup for more than 2 h
      - alert: BackupTooOld
        expr: time() - restic_last_success_timestamp_seconds > 7200
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "No successful backup of {{ $labels.host }} to {{ $labels.repo }} for more than 2 h" }

      # Restic: a server has never reported a backup (timer not running, script missing)
      - alert: BackupMetricMissing
        expr: absent(restic_backup_success{host="net01"}) or absent(restic_backup_success{host="mon01"})
        for: 2h
        labels: { severity: warning }
        annotations: { summary: "A server has not reported any backup result for 2 h" }

      # vzdump: no successful VM image for more than 26 h
      - alert: VzdumpTooOld
        expr: time() - vzdump_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "No successful VM backup of VM {{ $labels.vmid }} for more than 26 h" }

  - name: dhcp
    rules:
      - alert: DhcpPoolUsageHigh
        expr: kea_dhcp4_addresses_assigned_total / kea_dhcp4_addresses_total > 0.8
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "DHCP pool on {{ $labels.host }} more than 80 % used" }

