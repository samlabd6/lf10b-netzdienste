- name: Install Prometheus and helper tools
  ansible.builtin.apt:
    name: [prometheus, curl, jq]     # prometheus: server + promtool; jq: reads JSON in the scripts
    state: present
    update_cache: true

- name: Alarm rules (checked with promtool before activating)
  ansible.builtin.copy:
    src: alerts.yml
    dest: /etc/prometheus/alerts.yml
    owner: root
    group: prometheus
    mode: "0644"
    validate: promtool check rules %s
  notify: restart prometheus

- name: Prometheus configuration (checked with promtool before activating)
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: prometheus
    mode: "0644"
    validate: promtool check config %s
  notify: restart prometheus

- name: Prometheus running
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true

- name: Notification script (contains the webhook, therefore 0700)
  ansible.builtin.template:
    src: prometheus-notify.sh.j2
    dest: /usr/local/sbin/prometheus-notify
    mode: "0700"

- name: Command backup-status
  ansible.builtin.copy:
    src: backup-status.sh
    dest: /usr/local/bin/backup-status
    mode: "0755"

- name: systemd service and timer for the notifications
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
  loop: [prometheus-notify.service, prometheus-notify.timer]

- name: Notification timer active
  ansible.builtin.systemd:
    name: prometheus-notify.timer
    state: started
    enabled: true
    daemon_reload: true

