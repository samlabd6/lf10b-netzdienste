- name: Install restic
  ansible.builtin.apt: { name: restic, state: present, update_cache: true }

- name: Config directory (only root may read it)
  ansible.builtin.file: { path: /etc/restic, state: directory, mode: "0700" }

- name: Cloud environment file (repository and B2 keys)
  ansible.builtin.template: { src: cloud.env.j2, dest: /etc/restic/cloud.env, mode: "0600" }
  diff: false

- name: Wrapper command restic-cloud
  ansible.builtin.template: { src: restic-cloud.j2, dest: /usr/local/sbin/restic-cloud, mode: "0750" }

- name: Backup script
  ansible.builtin.template: { src: restic-backup.sh.j2, dest: /usr/local/sbin/restic-backup.sh, mode: "0750" }

- name: systemd service and timer
  ansible.builtin.template: { src: "{{ item }}.j2", dest: "/etc/systemd/system/{{ item }}" }
  loop: [restic-backup.service, restic-backup.timer]

- name: Check whether the cloud repository exists
  ansible.builtin.command: /usr/local/sbin/restic-cloud cat config
  register: repo_check
  changed_when: false
  failed_when: false

- name: Create the cloud repository if missing
  ansible.builtin.command: /usr/local/sbin/restic-cloud init
  when: repo_check.rc != 0

- name: Timer active
  ansible.builtin.systemd: { name: restic-backup.timer, state: started, enabled: true, daemon_reload: true }
  ignore_errors: "{{ ansible_check_mode }}"
